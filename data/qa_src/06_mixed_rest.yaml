- doc: employee_onboarding_en
  ev: "The probation period is 90 days"
  a_ar: "فترة التجربة 90 يوماً مع لقاءات متابعة في اليوم 30 و60 وتقييم رسمي في اليوم 85، ولا تطلب الإجازة السنوية إلا بعدها إلا في الطوارئ."
  a_en: "Probation is 90 days with check-ins at day 30 and 60 and a formal review at day 85; annual leave can only be requested after probation, except emergencies."
  qs:
    - [en, "How long is the probation period for new employees?"]
    - [ar, "هل يمكن للموظف الجديد أخذ إجازة خلال فترة التجربة؟"]
- doc: employee_onboarding_en
  ev: "25% staff discount on Saraya products"
  a_ar: "يحصل الموظفون على خصم 25% على منتجات سرايا بحد أقصى 20,000 ريال مشتريات سنوياً، والتأمين الطبي فئة B للموظفين وA للمدراء من اليوم الأول."
  a_en: "Employees get a 25% staff discount on Saraya products up to SAR 20,000 of purchases a year; medical insurance (class B staff, class A managers) starts on day 1."
  qs:
    - [en, "What is the employee discount on Saraya furniture?"]
    - [ar, "كم خصم الموظفين على منتجات الشركة؟"]
    - [en, "When does medical insurance start for new hires?"]
- doc: employee_onboarding_en
  ev: "Add dependants within 30 days of joining"
  a_ar: "يجب إضافة المعالين للتأمين خلال 30 يوماً من الالتحاق، وبعدها فقط عند التجديد السنوي في يناير."
  a_en: "Dependants must be added to medical insurance within 30 days of joining; later additions only at the annual renewal in January."
  qs:
    - [en, "Can I add my wife to the medical insurance three months after joining?"]
    - [ar, "متى أضيف عائلتي على التأمين الطبي؟"]
