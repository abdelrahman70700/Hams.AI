  ev: "12 electric vans"
  a_ar: "أضاف أسطول التوصيل 12 شاحنة كهربائية في الرياض، ونفذت 18% من توصيلات الرياض في الربع الرابع، وتوفر الألواح الشمسية نحو 30% من كهرباء مستودع الرياض."
  a_en: "The fleet added 12 electric vans in Riyadh, which made 18% of Riyadh deliveries in Q4; solar panels supply about 30% of the Riyadh warehouse's electricity."
